# Her push ve pull request'te: ruff + tüm testler (Tk testleri sanal ekranda, xvfb).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Istanbul          # geliştirme makinesiyle aynı saat dilimi
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Sistem paketleri (PortAudio, sanal ekran)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends portaudio19-dev xvfb

      - name: Python paketleri
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Tkinter var mı
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Ruff
        run: ruff check .

      - name: Testler
        run: xvfb-run -a python -m pytest -q
